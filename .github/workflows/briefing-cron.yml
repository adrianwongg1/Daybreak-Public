name: Briefing cron

# PRD 7.2's scheduling pattern: Netlify's free-tier Scheduled Functions only
# support coarse cadences, so a free GitHub Actions cron acts as the
# external trigger instead, hitting the app's own /api/briefing/cron route
# every 15 minutes like a normal HTTP request. See DECISIONS.md for the
# "who's due now" logic that route runs (app/lib/briefing/due.ts).
#
# One-time setup (repo → Settings → Secrets and variables → Actions):
#   - Variables tab: add APP_URL = this app's real deployed URL (e.g.
#     https://your-site.netlify.app), no trailing slash.
#   - Secrets tab: add CRON_SECRET = the same value set in the deployed
#     app's CRON_SECRET env var (see .env.local.example).
#
# GitHub disables scheduled workflows automatically after 60 days with no
# repository activity — a push or manual "Run workflow" re-enables it.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call briefing cron route
        env:
          APP_URL: ${{ vars.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -fsS -X POST "$APP_URL/api/briefing/cron" \
            -H "Authorization: Bearer $CRON_SECRET" \
            --max-time 90
