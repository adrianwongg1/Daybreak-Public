name: Weather cron

# Hourly refresh of every onboarded user's home + saved-city weather,
# written into today's stored briefing — same external-trigger pattern as
# briefing-cron.yml (see that file's comment for the one-time repo setup:
# APP_URL variable + CRON_SECRET secret, both reused here as-is).
#
# GitHub disables scheduled workflows automatically after 60 days with no
# repository activity — a push or manual "Run workflow" re-enables it.

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call weather cron route
        env:
          APP_URL: ${{ vars.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -fsS -X POST "$APP_URL/api/weather/cron" \
            -H "Authorization: Bearer $CRON_SECRET" \
            --max-time 90
